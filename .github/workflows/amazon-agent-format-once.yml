name: Format Amazon Seller Agent Once

on:
  push:
    branches:
      - feat/amazon-seller-agent
    paths:
      - ".github/workflows/amazon-agent-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/amazon-seller-agent
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Amazon Agent files
        run: npx biome check --write .pi/extensions/amazon-seller packages/amazon-agent/src packages/amazon-agent/test

      - name: Commit formatting changes
        shell: bash
        run: |
          git add .pi/extensions/amazon-seller packages/amazon-agent/src packages/amazon-agent/test
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(agent): format amazon seller agent files"
          git push origin HEAD:feat/amazon-seller-agent
